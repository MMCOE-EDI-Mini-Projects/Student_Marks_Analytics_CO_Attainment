<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBE Management System | CO-PO Attainment Platform</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Visual Reports -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Login Container -->
    <div id="auth-container" class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h2>OBE Management System</h2>
                <p>Outcome-Based Education & CO-PO Attainment Engine</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="login-username"><i class="fa-solid fa-user"></i> Username or Email</label>
                    <input type="text" id="login-username" placeholder="e.g. admin or faculty1" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- App Layout Container -->
    <div id="app-container" class="app-container hidden">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>OBE System</span>
            </div>
            
            <div class="user-badge" id="sidebar-user-badge">
                <div class="avatar" id="user-avatar">A</div>
                <div class="user-info">
                    <span class="user-name" id="user-display-name">Loading...</span>
                    <span class="user-role-badge" id="user-role-tag">ADMIN</span>
                </div>
            </div>

            <nav class="nav-menu" id="sidebar-nav">
                <!-- Dynamic Navigation Links Rendered by Role -->
            </nav>

            <div class="sidebar-footer">
                <button class="btn btn-logout" onclick="handleLogout()">
                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content View -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-title">
                    <h2 id="page-title">Dashboard</h2>
                    <span class="breadcrumb" id="page-breadcrumb">Home / Dashboard</span>
                </div>
                <div class="header-actions">
                    <button class="btn btn-icon" title="Refresh Data" onclick="refreshCurrentView()">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </button>
                </div>
            </header>

            <div id="view-content" class="view-content">
                <!-- Views loaded dynamically by JS -->
            </div>
        </main>
    </div>

    <!-- Global Modal Dialog Container -->
    <div id="modal-backdrop" class="modal-backdrop hidden">
        <div class="modal-card" id="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Title</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Modal Form / Details -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Versioned URLs prevent browsers from retaining a stale role-navigation bundle after deployment. -->
    <script src="js/app.js?v=20261016.3"></script>
    <script src="js/admin.js?v=20261016.3"></script>
    <script src="js/faculty.js?v=20261016.3"></script>
    <script src="js/student.js?v=20261016.3"></script>
</body>
</html>
